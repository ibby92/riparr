<title>Riparr Mockups</title>
<style>
/*
 * Riparr design tokens
 * --------------------
 * Layout concept: grey canvas, white cards with soft 1px borders, a quiet sidebar,
 * serif display headings over a plain UI sans. State lives in pills and chips.
 *
 * Neutrals carry a slight cool teal-slate bias toward the accent (hue ~200).
 * One accent (riptide teal). Semantic good / warn / critical are separate from it.
 * Host colours (gofile, pixeldrain, MEGA) are a validated categorical set:
 * use them for chart series, host chips and dots, always next to the host name.
 *
 * Light values on :root. Dark values are repeated in two blocks:
 *   - system dark, unless the user forced light;
 *   - an explicit data-theme="dark" override.
 * Keep both dark blocks identical.
 *
 * Fonts (Google Fonts):
 *   https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap
 */

:root {
  /* ---- Surfaces & ink ---- */
  --bg: #edf0f1;              /* app canvas */
  --surface: #ffffff;         /* cards, sidebar, inputs */
  --surface-2: #f5f7f8;       /* subtle fills: table headers, wells, hover */
  --surface-3: #e8ecee;       /* pressed / track backgrounds */
  --overlay: rgb(16 24 28 / 0.42); /* scrim behind drawers and modals */
  --border: #e0e5e7;
  --border-strong: #cdd5d8;
  --fg: #151b1e;              /* primary text */
  --fg-2: #39454a;            /* secondary text */
  --muted: #63727a;           /* labels, metadata (AA on surface and bg) */
  --faint: #98a4aa;           /* placeholders, disabled, chart grid labels */
  --grid: #e7ebed;            /* chart gridlines */

  /* ---- Accent (riptide teal) ---- */
  --accent: #0f7c86;
  --accent-hover: #0b6870;
  --accent-fg: #ffffff;       /* text on accent */
  --accent-soft: #e2f2f3;     /* tinted backgrounds: active nav, selected */
  --accent-ink: #0b616a;      /* accent-coloured text on light surfaces */
  --focus: #0f7c86;

  /* Primary button is ink, like the reference */
  --primary: #151b1e;
  --primary-hover: #2a3439;
  --primary-fg: #ffffff;

  /* ---- Semantic ---- */
  --good: #1d7f4e;
  --good-soft: #e3f3ea;
  --warn: #a2640a;
  --warn-soft: #fbf0db;
  --critical: #c4352b;
  --critical-soft: #fbe8e6;
  --info: var(--accent);
  --info-soft: var(--accent-soft);
  --paused: #63727a;
  --paused-soft: #edf0f1;

  /* ---- Hosts (validated categorical: CVD dE >= 16 adjacent, light) ---- */
  --host-gofile: #2f6fdb;
  --host-pixeldrain: #e07b1f;
  --host-mega: #c42d5c;
  --host-other: #7b8a91;

  /* ---- Poster placeholders (generated tiles until TMDB art loads) ---- */
  --poster-sat: 42%;
  --poster-l1: 46%;
  --poster-l2: 22%;
  --on-poster: #ffffff;

  /* ---- Type ---- */
  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --text-xs: 0.75rem;    /* 12  captions, chart labels */
  --text-sm: 0.8125rem;  /* 13  table cells, metadata */
  --text-base: 0.875rem; /* 14  UI body */
  --text-md: 1rem;       /* 16  card titles (sans), inputs on phones */
  --text-lg: 1.25rem;    /* 20  card titles (display) */
  --text-xl: 1.5rem;     /* 24  page titles on phones */
  --text-2xl: 1.875rem;  /* 30  page titles, stat values */
  --text-3xl: 2.25rem;   /* 36  hero numbers */
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --tracking-label: 0.06em; /* uppercase labels such as MENU */

  /* ---- Spacing (4px base) ---- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --gutter: 1rem;          /* page side gutter on phones */
  --gutter-lg: 1.75rem;    /* page side gutter on desktop */
  --sidebar-w: 16.5rem;
  --sidebar-w-collapsed: 4.25rem;

  /* ---- Radius ---- */
  --radius-xs: 4px;   /* chips, progress bars */
  --radius-sm: 8px;   /* inputs, buttons */
  --radius-md: 12px;  /* cards */
  --radius-lg: 16px;  /* modals, sheets, app frame */
  --radius-pill: 999px;

  /* ---- Elevation ---- */
  --shadow-xs: 0 1px 2px rgb(16 24 28 / 0.05);
  --shadow-sm: 0 1px 2px rgb(16 24 28 / 0.05), 0 2px 6px rgb(16 24 28 / 0.04);
  --shadow-md: 0 4px 12px rgb(16 24 28 / 0.08), 0 1px 3px rgb(16 24 28 / 0.06);
  --shadow-lg: 0 16px 40px rgb(16 24 28 / 0.16), 0 2px 8px rgb(16 24 28 / 0.08);

  /* ---- Motion ---- */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur: 200ms;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1315;
    --surface: #161c1f;
    --surface-2: #1b2326;
    --surface-3: #232d31;
    --overlay: rgb(0 0 0 / 0.6);
    --border: #253034;
    --border-strong: #34424a;
    --fg: #e8eef0;
    --fg-2: #c2ccd0;
    --muted: #8d9ba1;
    --faint: #5f6d74;
    --grid: #222c30;
    --accent: #3fb3ba;
    --accent-hover: #5cc4ca;
    --accent-fg: #062a2d;
    --accent-soft: #14302f;
    --accent-ink: #6cccd1;
    --focus: #5cc4ca;
    --primary: #e8eef0;
    --primary-hover: #ffffff;
    --primary-fg: #101518;
    --good: #4cc488;
    --good-soft: #12291e;
    --warn: #e2a647;
    --warn-soft: #2c2312;
    --critical: #f0776c;
    --critical-soft: #33191a;
    --paused: #8d9ba1;
    --paused-soft: #1f282b;
    --host-gofile: #5487e0;
    --host-pixeldrain: #c07a22;
    --host-mega: #db5279;
    --host-other: #74838a;
    --poster-sat: 34%;
    --poster-l1: 36%;
    --poster-l2: 15%;
    --on-poster: #f3f6f7;
    --shadow-xs: 0 1px 2px rgb(0 0 0 / 0.3);
    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3), 0 2px 6px rgb(0 0 0 / 0.2);
    --shadow-md: 0 4px 14px rgb(0 0 0 / 0.4), 0 1px 3px rgb(0 0 0 / 0.3);
    --shadow-lg: 0 18px 44px rgb(0 0 0 / 0.55), 0 2px 8px rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0e1315;
  --surface: #161c1f;
  --surface-2: #1b2326;
  --surface-3: #232d31;
  --overlay: rgb(0 0 0 / 0.6);
  --border: #253034;
  --border-strong: #34424a;
  --fg: #e8eef0;
  --fg-2: #c2ccd0;
  --muted: #8d9ba1;
  --faint: #5f6d74;
  --grid: #222c30;
  --accent: #3fb3ba;
  --accent-hover: #5cc4ca;
  --accent-fg: #062a2d;
  --accent-soft: #14302f;
  --accent-ink: #6cccd1;
  --focus: #5cc4ca;
  --primary: #e8eef0;
  --primary-hover: #ffffff;
  --primary-fg: #101518;
  --good: #4cc488;
  --good-soft: #12291e;
  --warn: #e2a647;
  --warn-soft: #2c2312;
  --critical: #f0776c;
  --critical-soft: #33191a;
  --paused: #8d9ba1;
  --paused-soft: #1f282b;
  --host-gofile: #5487e0;
  --host-pixeldrain: #c07a22;
  --host-mega: #db5279;
  --host-other: #74838a;
  --poster-sat: 34%;
  --poster-l1: 36%;
  --poster-l2: 15%;
  --on-poster: #f3f6f7;
  --shadow-xs: 0 1px 2px rgb(0 0 0 / 0.3);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3), 0 2px 6px rgb(0 0 0 / 0.2);
  --shadow-md: 0 4px 14px rgb(0 0 0 / 0.4), 0 1px 3px rgb(0 0 0 / 0.3);
  --shadow-lg: 0 18px 44px rgb(0 0 0 / 0.55), 0 2px 8px rgb(0 0 0 / 0.4);
  color-scheme: dark;
}

/* ---- Mockup-only tokens (not part of the app system) ---- */
:root { --device-bezel: #0b0f10; }

/* ================= Base ================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 500; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-xs); }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.display { font-family: var(--font-display); font-optical-sizing: auto; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lucide { width: 18px; height: 18px; stroke-width: 1.75; flex: none; }
.ic-sm .lucide, .lucide.ic-sm { width: 15px; height: 15px; }
i[data-lucide] { display: inline-block; width: 18px; height: 18px; flex: none; }

/* ================= Stage / phone preview ================= */
.stage { min-height: 100vh; }
.device { position: relative; }
body.phone-preview .stage {
  display: flex; justify-content: center; align-items: flex-start;
  padding: 24px 16px 96px;
}
body.phone-preview .device {
  width: 390px; max-width: 100%;
  height: min(844px, calc(100vh - 48px));
  border: 10px solid var(--device-bezel);
  border-radius: 46px;
  overflow: hidden;
  transform: translateZ(0); /* contains fixed drawers & modals */
  box-shadow: var(--shadow-lg);
  background: var(--bg);
}
body.phone-preview .device::before {
  content: ""; position: absolute; z-index: 90; top: 8px; left: 50%; translate: -50% 0;
  width: 96px; height: 26px; border-radius: 20px; background: var(--device-bezel);
}
body.phone-preview .app { height: 100%; overflow-y: auto; overflow-x: hidden; }
body.phone-preview .topbar { padding-top: 40px; }

/* ================= App shell ================= */
.app { container: app / inline-size; min-height: 100vh; }
body.phone-preview .app { min-height: 0; }
.shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100%;
  transition: grid-template-columns var(--dur) var(--ease);
}
.app.collapsed .shell { grid-template-columns: var(--sidebar-w-collapsed) minmax(0, 1fr); }

/* ---- Sidebar ---- */
.sidebar {
  position: sticky; top: 0; align-self: start;
  height: 100vh;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  z-index: 40;
}
body.phone-preview .sidebar { height: 100%; }
.side-head {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 14px 16px 18px;
  border-bottom: 1px solid var(--border);
  margin: 0 12px;
  padding-inline: 6px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; color: var(--fg); }
.brand:hover { text-decoration: none; }
.brand svg { width: 34px; height: 34px; flex: none; border-radius: 9px; }
.brand-name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 500; line-height: 1; letter-spacing: -0.01em; }
.brand-sub { font-size: var(--text-xs); color: var(--muted); margin-top: 3px; }
.side-scroll { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.menu-label {
  font-size: 11px; font-weight: 500; letter-spacing: var(--tracking-label); text-transform: uppercase;
  color: var(--faint); padding: 6px 10px 8px;
}
.nav-item, .nav-group > button {
  display: flex; align-items: center; gap: 11px; width: 100%;
  min-height: 38px; padding: 7px 10px;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--fg-2);
  font-size: var(--text-base); font-weight: 450; text-align: left;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.nav-item:hover, .nav-group > button:hover { background: var(--surface-2); color: var(--fg); text-decoration: none; }
.nav-item .lucide, .nav-group > button .lucide { color: var(--muted); }
.nav-item[aria-current="page"] { background: var(--surface-3); color: var(--fg); font-weight: 500; }
.nav-item[aria-current="page"] .lucide { color: var(--accent); }
.nav-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-badge {
  min-width: 22px; padding: 1px 7px; border-radius: var(--radius-pill);
  background: var(--surface-3); color: var(--fg-2);
  font-size: 11.5px; font-weight: 500; text-align: center; font-variant-numeric: tabular-nums;
}
.nav-badge.warn { background: var(--warn-soft); color: var(--warn); }
.nav-badge.crit { background: var(--critical-soft); color: var(--critical); }
.chev { transition: transform var(--dur) var(--ease); }
.nav-group[data-open="true"] > button .chev { transform: rotate(90deg); }
.nav-children { display: none; flex-direction: column; gap: 1px; padding: 2px 0 6px 21px; position: relative; }
.nav-children::before { content: ""; position: absolute; left: 19px; top: 4px; bottom: 10px; width: 1px; background: var(--border); }
.nav-group[data-open="true"] > .nav-children { display: flex; }
.nav-children .nav-item { min-height: 34px; padding-left: 16px; font-size: var(--text-sm); }
.nav-children .nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -2px; width: 2px; height: 18px; border-radius: 2px; background: var(--accent);
}
.nav-children .nav-item { position: relative; }

.side-card {
  margin: 8px 12px 14px; padding: 14px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
  display: flex; flex-direction: column; gap: 10px;
}
.side-card h3 { font-family: var(--font-display); font-size: 1rem; font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; }
.side-card h3 small { font-family: var(--font-sans); font-size: var(--text-xs); color: var(--muted); font-weight: 400; }
.host-mini { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px 8px; font-size: var(--text-sm); }
.host-mini .state { font-size: var(--text-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.host-mini .state.warn { color: var(--warn); }
.side-card .disk { padding-top: 10px; border-top: 1px dashed var(--border); font-size: var(--text-xs); color: var(--muted); display: grid; gap: 6px; }
.side-card .disk b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

/* collapsed sidebar */
.app.collapsed .nav-label, .app.collapsed .nav-badge, .app.collapsed .chev,
.app.collapsed .menu-label, .app.collapsed .side-card, .app.collapsed .brand-text,
.app.collapsed .nav-children { display: none !important; }
.app.collapsed .side-head { flex-direction: column; padding-inline: 0; }
.app.collapsed .nav-item, .app.collapsed .nav-group > button { justify-content: center; padding-inline: 0; }

/* ---- Top bar ---- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: 14px var(--gutter-lg);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.search {
  position: relative; flex: 0 1 340px; min-width: 0;
}
.search .lucide { position: absolute; left: 11px; top: 50%; translate: 0 -50%; color: var(--muted); width: 16px; height: 16px; }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 34px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--fg);
}
.search input::placeholder { color: var(--faint); }
.search kbd {
  position: absolute; right: 8px; top: 50%; translate: 0 -50%;
  font: 500 11px var(--font-mono); color: var(--faint);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; background: var(--surface-2);
}
.topbar .spacer { flex: 1; }
.icon-btn {
  position: relative;
  display: inline-grid; place-items: center;
  width: 38px; height: 38px; flex: none;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--fg-2);
  box-shadow: var(--shadow-xs);
}
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn .dot-badge {
  position: absolute; top: -5px; right: -5px;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--critical); color: var(--surface);
  font-size: 10.5px; font-weight: 600; line-height: 18px; text-align: center;
  border: 2px solid var(--bg); box-sizing: content-box;
}
.icon-btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.hamburger { display: none; }
.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.seg button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 32px; height: 30px; padding: 0 8px;
  border: 0; border-radius: 6px; background: transparent; color: var(--muted);
  font-size: var(--text-sm); font-weight: 500;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-xs); }
.seg .lucide { width: 16px; height: 16px; }
.user {
  display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 4px; height: 38px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
  box-shadow: var(--shadow-xs);
}
.avatar {
  width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; font-size: 12px;
}
.user .who { font-size: var(--text-sm); line-height: 1.2; }
.user .who small { display: block; color: var(--muted); font-size: 11.5px; }

/* popover */
.popover {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
  width: min(340px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); padding: 6px;
}
.popover h4 { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--muted); padding: 8px 10px 6px; font-weight: 500; }
.pop-item { display: flex; gap: 10px; padding: 10px; border-radius: var(--radius-sm); align-items: flex-start; width: 100%; border: 0; background: none; text-align: left; }
.pop-item:hover { background: var(--surface-2); }
.pop-item .pt-txt { font-size: var(--text-sm); color: var(--fg-2); }
.pop-item b { font-weight: 500; color: var(--fg); display: block; }

/* ---- Page ---- */
.page { width: 100%; max-width: 1400px; padding: 26px var(--gutter-lg) 64px; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); letter-spacing: -0.01em; }
.page-head p { color: var(--muted); margin-top: 4px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: var(--text-sm); color: var(--muted); margin-bottom: 6px; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted); }
.crumbs button:hover { color: var(--fg); text-decoration: underline; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-family: var(--font-display); font-size: var(--text-lg); }
.section-head .muted { font-size: var(--text-sm); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 14px; white-space: nowrap;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--fg);
  font-size: var(--text-base); font-weight: 500;
  box-shadow: var(--shadow-xs);
  transition: background var(--dur-fast), border-color var(--dur-fast);
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn .lucide { width: 16px; height: 16px; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-accent:hover { background: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--fg-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { color: var(--critical); }
.btn-sm { height: 30px; padding: 0 10px; font-size: var(--text-sm); }
.btn-icon { width: 38px; padding: 0; }
.btn-sm.btn-icon { width: 30px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---- Cards ---- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-xs);
  min-width: 0;
}
.card-pad { padding: 18px 20px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; flex-wrap: wrap; }
.card-h h2, .card-h h3 { font-family: var(--font-display); font-size: 1.15rem; }
.card-b { padding: 16px 20px 20px; }
.card-f { padding: 12px 20px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--radius-md) var(--radius-md); font-size: var(--text-sm); color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ---- Stat cards ---- */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.stat { padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 8px; }
.stat-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; color: var(--fg-2); font-size: var(--text-sm); }
.stat-ic { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2); color: var(--accent); }
.stat-ic .lucide { width: 15px; height: 15px; }
.stat-val { font-family: var(--font-display); font-size: var(--text-2xl); line-height: 1.05; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.01em; }
.stat-val small { font-family: var(--font-sans); font-size: var(--text-sm); color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.stat-foot { display: flex; justify-content: space-between; gap: 8px; font-size: var(--text-xs); color: var(--muted); align-items: center; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); }
.delta.down { color: var(--critical); }
.delta .lucide { width: 13px; height: 13px; stroke-width: 2.25; }

/* ---- Pills, chips, dots ---- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 500; white-space: nowrap;
  background: var(--surface-3); color: var(--fg-2);
}
.pill .lucide { width: 12px; height: 12px; stroke-width: 2.25; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--critical-soft); color: var(--critical); }
.pill.paused { background: var(--paused-soft); color: var(--paused); border: 1px solid var(--border); }
.pill.info { background: var(--accent-soft); color: var(--accent-ink); }
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px;
  border: 1px solid var(--border); border-radius: var(--radius-xs);
  font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: var(--fg-2); background: var(--surface);
  text-transform: uppercase;
}
.host {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 7px;
  border-radius: var(--radius-xs); white-space: nowrap;
  background: color-mix(in srgb, var(--c) 11%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--c) 26%, var(--surface));
  color: var(--fg-2); font-size: 12px; font-weight: 500;
}
.host::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.h-gofile { --c: var(--host-gofile); }
.h-pixeldrain { --c: var(--host-pixeldrain); }
.h-mega { --c: var(--host-mega); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warn); }
.dot.crit { background: var(--critical); }
.dot.host-c { background: var(--c); border-radius: 2px; }

/* ---- Progress ---- */
.bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; display: flex; gap: 2px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar > span.dl { background: color-mix(in srgb, var(--accent) 45%, var(--surface-3)); }
.bar > span.wait { background: var(--warn); opacity: 0.55; }
.bar > span.good { background: var(--good); }
.bar > span.warn { background: var(--warn); }
.bar > span.crit { background: var(--critical); }
.bar.thin { height: 4px; }
.bar.thick { height: 8px; border-radius: 4px; }

/* ---- Posters (placeholder art until TMDB images load) ---- */
.poster {
  position: relative; overflow: hidden; flex: none;
  aspect-ratio: 2 / 3; max-width: 100%;
  border-radius: 8px;
  background:
    radial-gradient(120% 70% at 85% 0%, hsl(calc(var(--h) + 40) var(--poster-sat) var(--poster-l1) / 0.9), transparent 60%),
    linear-gradient(165deg, hsl(var(--h) var(--poster-sat) var(--poster-l1)), hsl(calc(var(--h) - 25) var(--poster-sat) var(--poster-l2)));
  color: var(--on-poster);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 8%;
  container-type: inline-size;
}
.poster::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(115deg, rgb(255 255 255 / 0.05) 0 2px, transparent 2px 9px);
  mix-blend-mode: overlay;
}
.poster::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
  background: linear-gradient(transparent, rgb(0 0 0 / 0.45));
}
.poster .pt { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 500; line-height: 1.05; font-size: clamp(9px, 15cqi, 26px); text-wrap: balance; overflow-wrap: anywhere; }
.poster .py { position: relative; z-index: 1; font-size: clamp(7px, 8cqi, 12px); opacity: 0.8; margin-top: 4%; letter-spacing: 0.08em; }
.poster .pk { position: absolute; z-index: 1; top: 6%; left: 8%; font-size: clamp(6px, 7cqi, 10px); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; }
.poster.sm .pk, .poster.sm .py { display: none; }

/* ---- Title cards (dashboard) ---- */
.title-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tcard {
  display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px;
  padding: 14px; text-align: left; width: 100%;
  border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface);
  box-shadow: var(--shadow-xs);
  transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast);
}
.tcard:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.tcard .poster { width: 76px; }
.tcard-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tcard-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tcard h3 { font-family: var(--font-display); font-size: 1.08rem; line-height: 1.2; overflow-wrap: anywhere; }
.tcard .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--text-xs); color: var(--muted); }
.prog-row { display: flex; justify-content: space-between; font-size: var(--text-sm); gap: 8px; }
.prog-row b { font-weight: 500; font-variant-numeric: tabular-nums; }
.tcard-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: var(--text-xs); color: var(--muted); margin-top: auto; flex-wrap: wrap; }
.sources { display: inline-flex; gap: 8px; align-items: center; }
.src { display: inline-flex; align-items: center; gap: 4px; }
.note { font-size: var(--text-xs); display: flex; gap: 5px; align-items: flex-start; }
.note .lucide { width: 13px; height: 13px; margin-top: 2px; }
.note.warn { color: var(--warn); }
.note.crit { color: var(--critical); }

/* ---- Host strip ---- */
.host-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.host-cell { padding: 14px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.host-cell + .host-cell { border-left: 1px solid var(--border); }
.host-cell .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.host-cell .name { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.host-cell .sub { font-size: var(--text-xs); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- Chart ---- */
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; overflow: visible; }
.chart-wrap text { font-family: var(--font-sans); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--text-sm); color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: inline-block; }
.legend b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--fg); }
.tip {
  position: absolute; z-index: 5; pointer-events: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md); padding: 9px 11px; font-size: var(--text-sm); min-width: 150px;
}
.tip h5 { margin: 0 0 6px; font-size: var(--text-xs); color: var(--muted); font-weight: 500; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.tip .r span { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); }
.tip .r i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); display: inline-block; }
.tip .t { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-weight: 500; }
details.data-table summary { cursor: pointer; font-size: var(--text-sm); color: var(--muted); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.data-table summary::-webkit-details-marker { display: none; }

/* ---- Toolbar / filters ---- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface);
  font-size: var(--text-sm); color: var(--fg-2); font-weight: 500;
}
.fchip:hover { border-color: var(--border-strong); }
.fchip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.fchip .n { font-variant-numeric: tabular-nums; opacity: 0.7; font-weight: 400; }

/* ---- Library grid ---- */
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 18px 14px; }
.lcard { display: flex; flex-direction: column; gap: 8px; text-align: left; border: 0; background: none; padding: 0; color: inherit; min-width: 0; border-radius: 10px; }
.lcard .poster { width: 100%; border-radius: 10px; box-shadow: var(--shadow-sm); transition: transform var(--dur) var(--ease), box-shadow var(--dur); }
.lcard:hover .poster { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.lcard .over { position: absolute; z-index: 2; top: 8px; right: 8px; }
.lcard .over .pill { box-shadow: var(--shadow-sm); }
.lcard h3 { font-size: var(--text-base); font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.lcard .sub { font-size: var(--text-xs); color: var(--muted); display: flex; justify-content: space-between; gap: 6px; font-variant-numeric: tabular-nums; }

/* ---- Tables (become cards on phones) ---- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tbl th {
  text-align: left; font-weight: 500; font-size: var(--text-xs); color: var(--muted);
  padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap;
}
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .cell-title { display: flex; gap: 10px; align-items: center; min-width: 0; }
.tbl .cell-title .poster { width: 32px; border-radius: 4px; padding: 0; }
.tbl .file { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.tbl .strong { font-weight: 500; color: var(--fg); }
.row-link { cursor: pointer; }

/* ---- Tabs ---- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs button {
  border: 0; background: none; padding: 10px 12px; margin-bottom: -1px;
  font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap;
  display: inline-flex; gap: 6px; align-items: center;
}
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .count { font-size: 11px; background: var(--surface-3); padding: 0 6px; border-radius: 9px; color: var(--fg-2); }

/* ---- Title detail ---- */
.hero { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 24px; padding: 20px; }
.hero .poster { width: 150px; border-radius: 10px; box-shadow: var(--shadow-md); }
.hero h1 { font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1.05; letter-spacing: -0.015em; }
.hero h1 .yr { color: var(--muted); font-weight: 400; }
.hero-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--text-sm); color: var(--muted); margin-top: 8px; }
.hero-meta .sep { color: var(--faint); }
.hero p.ov { max-width: 68ch; color: var(--fg-2); margin-top: 12px; }
.hero .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.path {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  font-family: var(--font-mono); font-size: 12px; color: var(--fg-2);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
  overflow-wrap: anywhere;
}
.path .lucide { width: 13px; height: 13px; color: var(--muted); }
.hero-prog { display: grid; grid-template-columns: repeat(4, auto) 1fr; gap: 6px 18px; align-items: center; margin-top: 16px; font-size: var(--text-sm); }
.hero-prog .k { color: var(--muted); font-size: var(--text-xs); }
.hero-prog .v { font-weight: 500; font-variant-numeric: tabular-nums; }
.legend-sm { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--text-xs); color: var(--muted); }
.legend-sm span { display: inline-flex; gap: 5px; align-items: center; }
.legend-sm i { width: 10px; height: 6px; border-radius: 2px; display: inline-block; background: var(--c); }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.src-list { display: flex; flex-direction: column; }
.src-item { padding: 14px 20px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); }
.src-item .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.src-item .site { font-weight: 500; display: flex; gap: 8px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: var(--text-xs); color: var(--muted); }
.kv b { font-weight: 400; color: var(--fg-2); font-variant-numeric: tabular-nums; }

/* ---- Queue ---- */
.q-hosts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.q-host { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.q-host .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.q-host .name { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.q-host .big { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.q-host .sub { font-size: var(--text-xs); color: var(--muted); }
.q-host.limited { border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }
.q-section { overflow: hidden; }
.q-section > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 20px; flex-wrap: wrap; }
.q-section > header h2 { font-family: var(--font-display); font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
.q-section > header .count { font-family: var(--font-sans); font-size: 12px; color: var(--muted); font-weight: 500; background: var(--surface-3); border-radius: 9px; padding: 0 7px; }
.q-banner {
  margin: 0 20px 12px; padding: 10px 12px; border-radius: var(--radius-sm);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: var(--warn-soft); color: var(--fg); font-size: var(--text-sm);
}
.q-banner .lucide { color: var(--warn); }
.q-banner .grow { flex: 1; min-width: 180px; }
.countdown { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.q-item { display: grid; grid-template-columns: 40px minmax(0, 2.2fr) minmax(0, 1.4fr) auto; gap: 14px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border); }
.q-item .poster { width: 32px; border-radius: 4px; padding: 0; }
.q-item .what b { font-weight: 500; display: block; overflow-wrap: anywhere; }
.q-item .what .file { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.q-item .stat-line { display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--muted); gap: 8px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.q-item .stat-line b { color: var(--fg); font-weight: 500; }
.q-item .reason { font-size: var(--text-sm); color: var(--fg-2); }
.q-item .reason small { display: block; color: var(--muted); font-size: var(--text-xs); }
.q-item .acts { display: flex; gap: 6px; justify-content: flex-end; }
.q-item .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }

/* ---- History ---- */
.log-day { font-size: var(--text-xs); font-weight: 500; text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--muted); padding: 12px 20px 8px; background: var(--surface-2); border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); }
.log-day:first-child { border-top: 0; border-radius: var(--radius-md) var(--radius-md) 0 0; }
.log-row { display: grid; grid-template-columns: 56px 28px minmax(0, 1fr) 190px; gap: 12px; align-items: start; padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: var(--text-sm); }
.log-row:last-child { border-bottom: 0; }
.log-row time { color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.lvl { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; }
.lvl .lucide { width: 14px; height: 14px; stroke-width: 2; }
.lvl.info { background: var(--accent-soft); color: var(--accent-ink); }
.lvl.good { background: var(--good-soft); color: var(--good); }
.lvl.warn { background: var(--warn-soft); color: var(--warn); }
.lvl.crit { background: var(--critical-soft); color: var(--critical); }
.log-row .msg { color: var(--fg); padding-top: 3px; }
.log-row .msg small { display: block; color: var(--muted); font-size: var(--text-xs); margin-top: 2px; }
.log-row .ttl { color: var(--fg-2); padding-top: 3px; text-align: right; overflow-wrap: anywhere; }
.log-row .ttl button { border: 0; background: none; padding: 0; color: var(--accent-ink); text-align: right; }

/* ---- Forms ---- */
.form-grid { display: flex; flex-direction: column; gap: 18px; }
.set-section { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; padding: 22px 24px; }
.set-section + .set-section { border-top: 1px solid var(--border); }
.set-section .intro h3 { font-family: var(--font-display); font-size: 1.15rem; }
.set-section .intro p { color: var(--muted); font-size: var(--text-sm); margin-top: 4px; }
.fields { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field .lbl { font-size: var(--text-sm); font-weight: 500; color: var(--fg); }
.field .help { font-size: var(--text-xs); color: var(--muted); }
.input, .select, textarea.input {
  width: 100%; min-height: 38px; padding: 8px 11px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--fg); font-size: var(--text-base);
}
textarea.input { min-height: 84px; resize: vertical; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; }
.input::placeholder { color: var(--faint); }
.input:focus, .select:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.input.mono { font-family: var(--font-mono); font-size: 13px; }

const progLabel = (t) => t.type === "movie" ? (t.have ? "Downloaded" : t.dl ? `Downloading · ${t.dl.pct}%` : "Not downloaded") : `${t.have} / ${t.total} episodes`;

function progBar(t, cls = "") {
  const seg = [];
  const w = (n) => `${(n / t.total) * 100}%`;
  if (t.have) seg.push(`<span style="width:${w(t.have)}"></span>`);
  if (t.dl) seg.push(`<span class="dl" style="width:${(t.dl.pct / 100) * (100 / t.total)}%"></span>`);
  if (t.wait && t.wait.length) seg.push(`<span class="wait" style="width:${w(t.wait.length)}"></span>`);
  return `<div class="bar ${cls}" role="img" aria-label="${progLabel(t)}">${seg.join("")}</div>`;
}

function episodes(t) {
  const out = [];
  for (let i = 1; i <= t.total; i++) {
    const size = t.sizes[i - 1] || 0;
    let st, hostName = ["gofile", "gofile", "pixeldrain", "gofile", "mega"][i % 5];
    if (i <= t.have) st = { k: "done" };
    else if (t.dl && t.dl.ep === i) { st = { k: "dl", pct: t.dl.pct }; hostName = t.dl.host; }
    else if (t.wait && t.wait.includes(i)) { st = { k: "wait" }; hostName = t.waitHost; }
    else if (t.stalled && t.stalled.includes(i)) { st = { k: "stall" }; hostName = "gofile"; }
    else if (t.queued && t.queued.includes(i)) { st = { k: "queued" }; }
    else { st = { k: "missing" }; hostName = null; }
    out.push({ i, size, st, host: hostName });
  }
  return out;
}
function epStatus(e) {
  switch (e.st.k) {
    case "done": return `<span class="pill good">${ic("check")}Downloaded</span>`;
    case "dl": return `<span class="pill info">${ic("arrow-down")}Downloading ${e.st.pct}%</span>`;
    case "wait": return `<span class="pill warn">${ic("hourglass")}Waiting on pixeldrain</span>`;
    case "stall": return `<span class="pill crit">${ic("rotate-cw")}Retrying</span>`;
    case "queued": return `<span class="pill">${ic("list-ordered")}Queued</span>`;
    default: return `<span class="pill paused">${ic("circle-dashed")}Missing</span>`;
  }
}

function qItem(q, kind) {
  const t = byId[q.t];
  const label = t.type === "movie" ? `${t.name} (${t.year})` : `${t.name} · ${q.ep}`;
  let mid = "", acts = "";
  if (kind === "downloading") {
    const pct = Math.round((q.done / q.size) * 100);
    mid = `<div class="prog-col"><div class="bar"><span style="width:${pct}%"></span></div><div class="stat-line"><span><b>${pct}%</b> · ${mb(q.done)} of ${mb(q.size)}</span><span><b>${q.speed} MB/s</b> · ${q.eta} left</span></div></div>`;
    acts = `<button class="btn btn-ghost btn-sm btn-icon" aria-label="Pause" data-toast="Paused ${label}">${ic("pause")}</button><button class="btn btn-ghost btn-sm btn-icon" aria-label="Remove from queue" data-toast="Removed ${label} from the queue">${ic("x")}</button>`;
  } else if (kind === "waiting") {
    mid = `<div class="prog-col reason">Waiting on pixeldrain<small>Resumes in <span class="countdown" data-countdown-min>${remaining().mins} min</span> · ${mb(q.size)}</small></div>`;
    acts = `<button class="btn btn-sm" data-toast="No other host has ${label}. It stays on pixeldrain.">${ic("shuffle")}Try another host</button>`;
  } else if (kind === "stalled") {
    mid = `<div class="prog-col reason">${q.reason}<small>${q.detail} · next try in ${q.next} min</small></div>`;
    acts = `<button class="btn btn-sm" data-toast="Retrying ${label} now">${ic("rotate-cw")}Retry now</button>`;
  } else {
    mid = `<div class="prog-col reason">Queued<small>${mb(q.size)} · starts when a slot frees up</small></div>`;
    acts = `<button class="btn btn-ghost btn-sm btn-icon" aria-label="Move up" data-toast="Moved ${label} up">${ic("arrow-up")}</button><button class="btn btn-ghost btn-sm btn-icon" aria-label="Remove from queue" data-toast="Removed ${label} from the queue">${ic("x")}</button>`;
  }
  return `<div class="q-item">${poster(t, "sm")}<div class="what"><b><a href="#title" data-title="${t.id}" style="color:inherit">${label}</a></b><div class="file">${q.file}</div><div class="meta">${host(q.host)}</div></div>${mid}<div class="acts">${acts}</div></div>`;
}

/* ===================== Chart ===================== */
function drawChart() {
  const el = document.getElementById("chart");
  if (!el) return;
  const W = Math.max(280, el.clientWidth), H = 220;
  const m = { l: 34, r: 6, t: 10, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = 6, ticks = [0, 2, 4, 6];
  const y = (v) => m.t + ih - (v / max) * ih;
  const band = iw / DAYS.length, bw = Math.min(30, band * 0.6);
  const keys = ["--host-gofile", "--host-pixeldrain", "--host-mega"];
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gigabytes downloaded per day over the last 14 days, stacked by host">`;
  ticks.forEach((t) => {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--${t === 0 ? "border-strong" : "grid"})" stroke-width="1"/>`;
    s += `<text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${t}${t === max ? " GB" : ""}</text>`;
  });
  const every = band < 44 ? 2 : 1;
  DAYS.forEach((d, i) => {
    const cx = m.l + band * i + band / 2, x = cx - bw / 2;
    let acc = 0;
    const vals = [d[1], d[2], d[3]];
    const top = vals.reduce((a, v, k) => (v > 0 ? k : a), -1);
    vals.forEach((v, k) => {
      if (v <= 0) return;
      const y0 = y(acc), y1 = y(acc + v);
      const gap = acc > 0 ? 2 : 0;
      const h = Math.max(1, y0 - y1 - gap);
      const yy = y1;
      if (k === top) {
        const r = Math.min(4, h, bw / 2);
        s += `<path d="M${x} ${yy + h}V${yy + r}Q${x} ${yy} ${x + r} ${yy}H${x + bw - r}Q${x + bw} ${yy} ${x + bw} ${yy + r}V${yy + h}Z" style="fill:var(${keys[k]})"/>`;
      } else s += `<rect x="${x}" y="${yy}" width="${bw}" height="${h}" style="fill:var(${keys[k]})"/>`;
      acc += v;
    });
    if (i === DAYS.length - 1) {
      s += `<text x="${cx}" y="${y(acc) - 6}" text-anchor="middle" style="fill:var(--fg);font-weight:500">${acc.toFixed(1)}</text>`;
    }
    if ((DAYS.length - 1 - i) % every === 0) s += `<text x="${cx}" y="${H - 6}" text-anchor="middle"${i === DAYS.length - 1 ? ' style="fill:var(--fg);font-weight:500"' : ""}>${d[0]}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" style="fill:transparent"/>`;
  });
  s += `</svg><div class="tip" hidden></div>`;
  el.innerHTML = s;
  const tip = el.querySelector(".tip");
  el.querySelectorAll(".hit").forEach((r) => {
    const show = () => {
      const d = DAYS[+r.dataset.i];
      const tot = d[1] + d[2] + d[3];
      tip.innerHTML = `<h5>${d[0] === "Today" ? "Today, Oct 10" : d[0]}</h5>
        <div class="r"><span style="--c:var(--host-gofile)"><i></i>gofile</span><b>${d[1].toFixed(1)} GB</b></div>
        <div class="r"><span style="--c:var(--host-pixeldrain)"><i></i>pixeldrain</span><b>${d[2].toFixed(1)} GB</b></div>
        <div class="r"><span style="--c:var(--host-mega)"><i></i>MEGA</span><b>${d[3].toFixed(1)} GB</b></div>
        <div class="r t"><span>Total</span><b>${tot.toFixed(1)} GB</b></div>`;
      tip.hidden = false;
      const bx = +r.getAttribute("x") + band / 2;
      const tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(0, bx - tw / 2), W - tw) + "px";
      tip.style.top = Math.max(0, y(tot) - tip.offsetHeight - 10) + "px";
      r.style.fill = "var(--grid)"; r.style.fillOpacity = "0.6";
    };
    const hide = () => { tip.hidden = true; r.style.fill = "transparent"; };
    r.addEventListener("mouseenter", show);
    r.addEventListener("mouseleave", hide);
    r.addEventListener("click", show);
  });
}

    <header><div><h2 id="add-h">Add title</h2><div class="steps"><b>${add.step === 1 ? "1. Find it on TMDB" : "2. Choose where it goes"}</b><span>· step ${add.step} of 2</span></div></div><button class="icon-btn ghost" data-close aria-label="Close">${ic("x")}</button></header>
    <form class="body" id="add-form">${body}</form>
    <footer>${add.step === 1 ? `<span class="muted" style="font-size:var(--text-xs);align-self:center">Can't find it? Add it without TMDB.</span><button type="button" class="btn btn-primary" data-step="2">Continue${ic("arrow-right")}</button>`
      : `<button type="button" class="btn" data-step="1">${ic("arrow-left")}Back</button><button type="submit" form="add-form" class="btn btn-primary">${ic("plus")}Add ${r.name}</button>`}</footer>
  </div>`;
}
function updatePreview() {
  const p = document.getElementById("a-preview");
  if (!p) return;
  const r = TMDB[add.pick];
  const root = document.getElementById("a-root").value;
  const folder = document.getElementById("a-folder").value || "…";
  const ss = document.getElementById("a-season");
  const season = r.type !== "Movie" && (!ss || ss.checked);
  const file = r.type === "Movie" ? `${folder.replace(/[^A-Za-z0-9]+/g, ".").replace(/\.$/, "")}.1080p.mkv` : `${folder.replace(/[^A-Za-z0-9]+/g, ".")}.S01E01.1080p.mkv`;
  p.innerHTML = `<span class="seg-root">${root}/</span><span class="seg-title">${folder}</span>/${season ? `<span class="seg-season">Season 01</span>/` : ""}${file}`;
}
function openModal() {
  add.step = 1;
  document.getElementById("modal-root").innerHTML = addModal();
  document.getElementById("modal-scrim").classList.add("on");
  icons();
  const q = document.getElementById("tmdb-q"); if (q) q.focus();
}
function rerenderModal() { document.getElementById("modal-root").innerHTML = addModal(); icons(); updatePreview(); }
function closeModal() { document.getElementById("modal-root").innerHTML = ""; document.getElementById("modal-scrim").classList.remove("on"); }

/* ===================== Misc behaviour ===================== */
function toast(msg) {
  const box = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `${ic("check")}<span></span>`;
  t.querySelector("span").textContent = msg;
  box.appendChild(t); icons();
  setTimeout(() => t.remove(), 3200);
}
function icons() { document.querySelectorAll("i[data-lucide]").forEach((el) => { el.outerHTML = ic(el.dataset.lucide, el.getAttribute("class") || ""); }); }

function namingPreview() {
  const p = document.getElementById("mm-preview"); if (!p) return;
  const tpl = document.getElementById("mm-ep").value;
  const name = tpl.replace(/\{title\}/g, "Doctor X").replace(/\{year\}/g, "2026").replace(/\{season\}/g, "01").replace(/\{episode\}/g, "05").replace(/\{quality\}/g, "1080p").replace(/\{filename\}/g, "Doctor.X.Mafia.in.White.S01E05.1080p.WEB-DL").replace(/\{host\}/g, "gofile");
  p.innerHTML = `<span class="seg-root">/media/Kdrama/</span><span class="seg-title">Doctor X</span>/<span class="seg-season">Season 01</span>/${name.replace(/</g, "&lt;")}.mkv`;
}

function applyTheme() {
  const r = document.documentElement;
  if (state.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", state.theme);
  document.querySelectorAll("[data-set-theme]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.setTheme === state.theme)));
  store.set("theme", state.theme);
}

function tick() {
  const r = remaining();
  document.querySelectorAll("[data-countdown]").forEach((e) => { e.textContent = r.text; });
  document.querySelectorAll("[data-countdown-min]").forEach((e) => { e.textContent = r.mins + " min"; });
}

const TITLES_FOR = { dashboard: "Dashboard", shows: "Shows", movies: "Movies", queue: "Queue", history: "History" };
function render(focusMain) {
  const main = document.getElementById("page");
  main.innerHTML = S[state.screen]();
  renderSidebar();
  icons();
  drawChart();
  namingPreview();
  store.set("screen", state.screen);
  store.set("title", state.title);
  const appEl = document.getElementById("app");
  appEl.classList.remove("drawer-open");
  document.getElementById("drawer-scrim").classList.remove("on");
  if (focusMain) { const sc = document.body.classList.contains("phone-preview") ? appEl : null; if (sc) sc.scrollTop = 0; else window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
}
function go(screen) { state.screen = screen; state.libFilter = "all"; if (screen === "title") state.detailTab = "episodes"; render(true); }

/* ===================== Events ===================== */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-title],[data-toggle-group],[data-action],[data-toast],[data-filter],[data-view],[data-tab],[data-set-theme],[data-close],[data-step],[data-pick],[data-add-src],[data-rm-src],[data-test],[data-reveal],[data-token],[data-restore],[data-confirm],[data-cancel],[data-seg],#hamburger,#drawer-scrim,#modal-scrim,#collapse,#phone-toggle,#bell");
  if (!el) { const pop = document.getElementById("bell-pop"); if (pop && !e.target.closest(".bell-wrap")) pop.hidden = true; return; }
  if (el.tagName === "A") e.preventDefault();
  const d = el.dataset;
  if (d.go) return go(d.go);
  if (d.title) { state.title = d.title; closeModal(); const pop = document.getElementById("bell-pop"); if (pop) pop.hidden = true; return go("title"); }
  if (d.toggleGroup) {
    const appEl = document.getElementById("app");
    if (appEl.classList.contains("collapsed")) { appEl.classList.remove("collapsed"); state.open[d.toggleGroup] = true; }
    else state.open[d.toggleGroup] = !(el.parentElement.dataset.open === "true");
    if (!state.open[d.toggleGroup] && NAV.find((g) => g.group === d.toggleGroup).items.some((i) => i.id === groupOf(state.screen))) state.open[d.toggleGroup] = true;
    renderSidebar(); icons(); return;
  }
  if (d.action === "add") return openModal();
  if (d.action === "check-all") return toast("Checking 11 sources across 10 titles");
  if (d.action === "backup") {
    BACKUPS.unshift(["riparr-manual-2026-10-10.db", "Manual", "2.4 MB", "Just now"]);
    render(); return toast("Backup created: riparr-manual-2026-10-10.db");
  }
  if (d.restore != null) {
    const tr = el.closest("tr");
    const b = BACKUPS[+d.restore];
    tr.classList.add("confirm-row");
    tr.lastElementChild.innerHTML = `<span style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center"><span style="font-size:var(--text-xs);color:var(--critical)">Replaces current data</span><button class="btn btn-sm" data-cancel="${d.restore}">Cancel</button><button class="btn btn-sm btn-primary" data-confirm="${b[0]}">Restore</button></span>`;
    return;
  }
  if (d.cancel != null) return render();
  if (d.confirm) { render(); return toast(`Restoring ${d.confirm}. Riparr restarts when it's done.`); }
  if (d.toast) return toast(d.toast);
  if (d.filter) { state.libFilter = d.filter; return render(); }
  if (d.view) { state.libView = d.view; return render(); }
  if (d.tab) { state.detailTab = d.tab; return render(); }
  if (d.setTheme) { state.theme = d.setTheme; applyTheme(); drawChart(); return; }
  if (d.seg != null) { el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === el))); return; }
  if (d.close != null || el.id === "modal-scrim") return closeModal();
  if (d.step) {
    if (add.step === 2) { const ss = document.getElementById("a-season"); if (ss) add.season = ss.checked; const rr = document.getElementById("a-root"); if (rr) add.root = rr.value; }
    add.step = +d.step;
    if (add.step === 2) add.root = TMDB[add.pick].type === "Movie" ? "/media/Movies" : "/media/Kdrama";
    return rerenderModal();
  }
  if (d.pick != null) { add.pick = +d.pick; return rerenderModal(); }
  if (d.addSrc != null) { add.sources = collectSources(); add.sources.push(""); rerenderModal(); const last = document.getElementById(`a-src-${add.sources.length - 1}`); if (last) last.focus(); return; }
  if (d.rmSrc != null) { add.sources = collectSources(); add.sources.splice(+d.rmSrc, 1); if (!add.sources.length) add.sources.push(""); return rerenderModal(); }
  if (d.test) {
    const out = document.getElementById("r-" + d.test);
    out.className = "result"; out.innerHTML = `<span class="muted">Testing…</span>`;
    setTimeout(() => {
      out.className = "result good";
      out.innerHTML = {
        flare: `${ic("circle-check")}<span>Connected · FlareSolverr v3.3.21 · answered in 412 ms</span>`,
        proxy: `${ic("circle-check")}<span>Working · exit IP <b class="mono">185.213.155.74</b> (Amsterdam, NL). Your home IP is hidden.</span>`,
        tmdb: `${ic("circle-check")}<span>Key works · TMDB answered in 180 ms</span>`,
      }[d.test];
      icons();
    }, 650);
    return;
  }
  if (d.reveal) { const inp = document.getElementById(d.reveal); inp.type = inp.type === "password" ? "text" : "password"; el.setAttribute("aria-label", inp.type === "password" ? "Show key" : "Hide key"); return; }
  if (d.token) {
    const inp = document.getElementById(el.parentElement.dataset.target);
    const pos = inp.selectionStart ?? inp.value.length;
    inp.value = inp.value.slice(0, pos) + d.token + inp.value.slice(inp.selectionEnd ?? pos);
    inp.focus(); inp.setSelectionRange(pos + d.token.length, pos + d.token.length); namingPreview(); return;
  }
  if (el.id === "hamburger") { document.getElementById("app").classList.add("drawer-open"); document.getElementById("drawer-scrim").classList.add("on"); return; }
  if (el.id === "drawer-scrim") { document.getElementById("app").classList.remove("drawer-open"); el.classList.remove("on"); return; }
  if (el.id === "collapse") { const a = document.getElementById("app"); a.classList.toggle("collapsed"); el.setAttribute("aria-pressed", String(a.classList.contains("collapsed"))); return; }
  if (el.id === "bell") { const pop = document.getElementById("bell-pop"); pop.hidden = !pop.hidden; el.setAttribute("aria-expanded", String(!pop.hidden)); return; }
  if (el.id === "phone-toggle") {
    const on = !document.body.classList.contains("phone-preview");
    document.body.classList.toggle("phone-preview", on);
    el.setAttribute("aria-pressed", String(on));
    el.querySelector("span").textContent = on ? "Desktop view" : "Phone preview";
    store.set("phone", on ? "1" : "0");
    requestAnimationFrame(drawChart);
  }
});
function collectSources() { return add.sources.map((_, i) => { const x = document.getElementById(`a-src-${i}`); return x ? x.value : ""; }); }

document.addEventListener("input", (e) => {
  if (e.target.closest("#add-form")) updatePreview();
  if (e.target.id === "mm-ep") namingPreview();
});
document.addEventListener("change", (e) => {
  if (e.target.closest("#add-form")) updatePreview();
  if (e.target.matches("[data-theme-radio]")) { state.theme = e.target.value; applyTheme(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "add-form") {
    if (add.step === 1) { add.step = 2; return rerenderModal(); }
    const r = TMDB[add.pick];
    closeModal(); toast(`Added ${r.name}. Checking its sources now.`);
    return;
  }
  if (e.target.dataset.form === "settings") toast("Settings saved");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); document.getElementById("app").classList.remove("drawer-open"); document.getElementById("drawer-scrim").classList.remove("on"); const p = document.getElementById("bell-pop"); if (p) p.hidden = true; }
  if (e.key === "Enter" && e.target.matches("tr[data-title]")) { state.title = e.target.dataset.title; go("title"); }
  if (e.key === "/" && !e.target.closest("input,textarea,select")) { e.preventDefault(); const s = document.getElementById("top-search"); if (s) s.focus(); }
});
document.getElementById("top-search-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = document.getElementById("top-search").value.trim().toLowerCase();
  const hit = TITLES.find((t) => t.name.toLowerCase().includes(q));
  if (q && hit) { state.title = hit.id; go("title"); } else toast(q ? `No title matches "${q}"` : "Type a title name");
});

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawChart, 120); });

/* ===================== Boot ===================== */
document.getElementById("brand-mark").innerHTML = mark("sb");
document.getElementById("mobile-mark").innerHTML = mark("mb");
document.getElementById("bell-list").innerHTML = TITLES.filter((t) => t.status === "attention").map((t) => `<button class="pop-item" data-title="${t.id}"><span class="lvl crit">${ic("triangle-alert")}</span><span class="pt-txt"><b>${t.name}</b>${t.note.text}</span></button>`).join("");
if (store.get("phone", "0") === "1" && window.innerWidth > 720) {
  document.body.classList.add("phone-preview");
  const b = document.getElementById("phone-toggle"); b.setAttribute("aria-pressed", "true"); b.querySelector("span").textContent = "Desktop view";
}
applyTheme();
render();
setInterval(tick, 1000);
})();

</script>
