# Riparr, deployed like Sonarr/Radarr. Build the image first with `npm run release`.
services:
  riparr:
    image: riparr:latest
    container_name: riparr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      # Your media library, e.g. the NAS "Videos" share. Add root folders under it in
      # Settings → Media Management (e.g. /media/Kdrama, /media/Movies).
      - /path/to/Videos:/media
    ports:
      - "7676:7676" # web UI
      - "9666:9666" # Click'n'Load listener
    # FlareSolverr and a VPN proxy (e.g. gluetun's HTTPPROXY) are set by URL in
    # Settings → Connections. Their hostnames only resolve if Riparr shares their
    # Docker network; see docker-compose.existing-gluetun.yml for an example.
